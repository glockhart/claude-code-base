# Opt-in, enabled by `claude-sandbox proxy up --vscode`.
#
# The VS Code server downloads itself into the container the first time you
# attach, and the marketplace serves the extension. Behind a default-deny proxy
# neither happens, and the failure presents as a hang rather than an error.
#
# Uncomment to enable:
# update.code.visualstudio.com
# vscode.download.prss.microsoft.com
# .vscode-cdn.net
# vscode.blob.core.windows.net
# marketplace.visualstudio.com
# .gallery.vsassets.io
# .gallerycdn.vsassets.io
