# Egress allowlist for the Claude Code sandbox.
#
# Matches on the CONNECT hostname. No TLS interception, so no CA is generated,
# no CA sits in the image for the agent to abuse, and certificates are untouched.
#
# The tradeoff, stated because it is routinely overclaimed: with CONNECT this
# proxy sees "host:443" and NOTHING else. Not the path, not the query, not the
# body. Every allowlisted host is therefore a two-way channel. The allowlist
# stops attacker-controlled destinations; it does not stop exfiltration as a
# category. See docs/threat-model.md.

http_port 3128

acl localnet     src 10.99.0.0/24
acl healthcheck  src 127.0.0.1
acl SSL_ports    port 443
acl Safe_ports   port 80 443
acl CONNECT      method CONNECT

# Required hosts for Claude Code itself.
acl allowed dstdomain "/etc/squid/allowlist.conf"
# Package registries and forge. Opt-in, mounted by the launcher.
acl allowed dstdomain "/etc/squid/allowlist.optional.conf"
# VS Code server and marketplace. Opt-in, mounted by the launcher.
acl allowed dstdomain "/etc/squid/allowlist.vscode.conf"
# Your own additions. Gitignored.
acl allowed dstdomain "/etc/squid/allowlist.local.conf"

http_access deny !localnet
http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access allow localnet allowed
http_access deny all

# Never become shared state between runs.
cache deny all

# stdout IS the egress audit trail: `claude-sandbox proxy logs` shows every host
# the agent reached for, allowed and denied. TCP_DENIED/403 lines are also how
# you decide what belongs in allowlist.local.conf.
# Exclude the healthcheck, which opens and closes a socket without sending a
# request. Otherwise it writes a line every 5s and buries the real signal.
access_log stdio:/dev/stdout combined !healthcheck
cache_log  stdio:/dev/stderr
pid_filename /var/run/squid/squid.pid

# Do not advertise ourselves or the client to the upstream.
via off
forwarded_for delete
httpd_suppress_version_string on
shutdown_lifetime 5 seconds

# The container already runs as the squid user, so no privilege drop happens
# here. Naming it explicitly keeps squid from attempting one and failing.
cache_effective_user proxy
