# Opt-in. Empty by default: squid errors on a missing ACL file, not an empty one.
#
# github.com is NOT here by default. It is a write-capable host, so allowlisting
# it opens a real exfiltration channel (gists, PR bodies). What actually binds is
# the absence of a write credential in the container, not the absence of the
# host, so enabling this is reasonable - just do it knowingly.
#
# Uncomment what a project genuinely needs:
# .github.com
# .githubusercontent.com
# codeload.github.com
# deb.debian.org
# security.debian.org
# .pypi.org
# files.pythonhosted.org
# .crates.io
# static.crates.io
# proxy.golang.org
# sum.golang.org
