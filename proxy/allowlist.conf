# Required for Claude Code. Sourced from Anthropic's published network
# requirements. A leading dot matches the apex and every subdomain.
#
# One hostname per line. Squid treats a whole line starting with # as a comment,
# so keep annotations on their own lines rather than trailing a hostname.

# API and the MCP connector proxy
.anthropic.com

# Account auth and plugin downloads
.claude.ai

# OAuth token exchange and docs lookups
.claude.com

# Artifacts and the Chrome extension bridge
.claudeusercontent.com

# Plugin install counts and metadata
storage.googleapis.com

# Plugin installs and npm packages
registry.npmjs.org

# Changelog feed for /release-notes
raw.githubusercontent.com

# Deliberately absent: the two Datadog telemetry hosts. Managed settings set
# CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC=1, so they are never requested.
#
# Deliberately absent: github.com. See allowlist.optional.conf for why.
